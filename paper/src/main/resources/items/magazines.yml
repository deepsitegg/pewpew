# Magazine items, only used while 'advanced.magazines' is true in config.yml.
#
# A magazine is an item that holds rounds of one ammoType. Pick up ammo and click
# a magazine in your inventory to fill it. Reloading a gun swaps the fullest
# matching magazine in and ejects the old one, rounds intact, so nothing is lost.
# Every gun also gains a chamber holding one round on top of the magazine.
#
# 'capacity' replaces the gun's own maxAmmo while a magazine is inserted.
#
# Optional 'modelSuffix' and 'gunModelData' change how the GUN looks while this
# magazine is installed, see the state models section in guns.yml. They do not
# touch the magazine item's own itemModel or customModelData.

pistol_9mm_mag:
  type: MAGAZINE
  name: "<gray>9mm Magazine"
  lore:
    - "<dark_gray>Double-stack pistol magazine"
  itemModel: "minecraft:iron_nugget"
  maxStack: 1
  ammoType: pistol_9mm
  capacity: 17

